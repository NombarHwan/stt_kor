name: Build and release exe

on:
  push:
    tags:
      - "v*"          # v1.0.0 같은 태그를 push 하면 실행

permissions:
  contents: write     # 릴리스 생성/업로드 권한

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller faster-whisper

      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name STT_KOR `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all onnxruntime `
            stt_app.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/STT_KOR.exe
          generate_release_notes: true
