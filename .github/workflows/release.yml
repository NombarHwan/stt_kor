name: Build and release exe

on:
  push:
    tags:
      - "v*"          # v1.0.0 같은 태그를 push 하면 실행

permissions:
  contents: write     # 릴리스 생성/업로드 권한

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 이전 태그와 비교해 패치노트를 만들기 위해 전체 이력 필요

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build patch notes
        id: notes
        run: |
          # 앱의 업데이트 창에 그대로 표시되는 짧은 패치노트.
          # 1순위: annotated tag 메시지 (git tag -a v1.0.5 -m "- 무엇을 고쳤는지")
          # 2순위: 이전 태그 이후의 커밋 제목 목록
          # git 출력(한글 커밋 메시지)이 깨지지 않도록 콘솔 인코딩을 UTF-8로 고정.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = "${{ github.ref_name }}"
          $msg = ((git tag -l $tag --format='%(contents:subject)%0a%(contents:body)') -join "`n").Trim()
          if (-not $msg) {
            $prev = git describe --tags --abbrev=0 "$tag^"
            if ($LASTEXITCODE -eq 0 -and $prev) {
              $msg = ((git log --no-merges --pretty=format:'- %s' "$prev..$tag") -join "`n").Trim()
            } else {
              $msg = ((git log --no-merges --pretty=format:'- %s' -n 10 $tag) -join "`n").Trim()
            }
          }
          if (-not $msg) { $msg = "- 소소한 개선과 버그 수정" }
          Write-Host "패치노트:`n$msg"
          "text<<STT_PATCH_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $msg                    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "STT_PATCH_NOTES"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      # 앱이 "지금 쓰는 버전"을 알아야 업데이트 알림을 띄울 수 있다.
      # PowerShell 대신 Python으로 고쳐 쓴다 (한글 주석이 깨지지 않도록 인코딩을 명시).
      - name: Stamp version into stt_app.py
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import io, os, re, sys

          version = os.environ["TAG"].lstrip("vV")
          path = "stt_app.py"
          text = io.open(path, encoding="utf-8", newline="").read()
          new, count = re.subn(
              '(?m)^APP_VERSION = "[^"]*"', 'APP_VERSION = "%s"' % version, text
          )
          if count != 1:
              sys.exit("stt_app.py 에서 APP_VERSION 줄을 찾지 못했습니다.")
          io.open(path, "w", encoding="utf-8", newline="").write(new)
          print("APP_VERSION =", version)

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller faster-whisper

      - name: Build (onedir, no UPX)
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name STT_KOR `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all onnxruntime `
            stt_app.py

      - name: Build installer (Inno Setup)
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          function Resolve-Iscc {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $p) { return $p }
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $iscc = Resolve-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Resolve-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe 를 찾을 수 없습니다." }
          & $iscc /DAppVersion=$ver installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 빌드 실패 (exit $LASTEXITCODE)" }

      - name: Package assets + SHA256
        run: |
          $ver   = "${{ github.ref_name }}"
          $zip   = "STT_KOR-$ver-windows-x64.zip"
          $setup = "installer_out\STT_KOR-$ver-Setup.exe"
          Compress-Archive -Path dist/STT_KOR -DestinationPath $zip
          if (-not (Test-Path $setup)) { throw "설치 파일이 없습니다: $setup" }
          foreach ($f in @($zip, $setup)) {
            $name = [System.IO.Path]::GetFileName($f)
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File "$f.sha256.txt" -Encoding ascii
          }
          "ASSET_SETUP=$setup"                | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "ASSET_SETUP_SHA=$setup.sha256.txt" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "ASSET_ZIP=$zip"                    | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "ASSET_ZIP_SHA=$zip.sha256.txt"     | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_SETUP }}
            ${{ env.ASSET_SETUP_SHA }}
            ${{ env.ASSET_ZIP }}
            ${{ env.ASSET_ZIP_SHA }}
          generate_release_notes: true
          # 아래 "## 이번 업데이트" 섹션은 앱의 업데이트 알림 창에 그대로 표시된다.
          # 제목 문구를 바꾸면 stt_app.py 의 PATCH_NOTES_HEADING 도 함께 고쳐야 한다.
          body: |
            ## 이번 업데이트

            ${{ steps.notes.outputs.text }}

            ## 설치 방법 (권장)

            1. 아래 **STT_KOR-${{ github.ref_name }}-Setup.exe** 를 받아 더블클릭합니다.
            2. "Windows가 PC를 보호했습니다" 창이 뜨면 **추가 정보 → 실행**.
               (서명되지 않은 개인 제작 프로그램이라 그렇습니다. 바이러스가 아닙니다.)
            3. 설치가 끝나면 **바탕화면** 또는 **시작 메뉴**의 "한국어 강의 STT" 아이콘으로 실행합니다.

            Python 설치도, 관리자 권한도 필요 없습니다.
            이미 쓰고 있다면 프로그램이 알아서 새 버전을 알려주므로, 알림 창의 **지금 업데이트**만 누르면 됩니다.

            ## 압축(zip)으로 받고 싶다면

            **STT_KOR-${{ github.ref_name }}-windows-x64.zip** 을 받아 압축을 풀고
            `STT_KOR` 폴더 안의 **STT_KOR.exe** 를 실행합니다.
            (exe 하나만 빼내면 실행되지 않습니다. 폴더째 두세요.)

            ## 참고

            - 첫 실행 시 음성 인식 모델(수백 MB~수 GB)을 자동으로 내려받습니다.
            - NVIDIA GPU가 있으면 최초 1회 CUDA 라이브러리(약 1.3GB) 다운로드 여부를 물어봅니다. '아니오'를 누르면 CPU로 동작합니다.
            - `*.sha256.txt` 는 무결성 검증용 체크섬입니다.
